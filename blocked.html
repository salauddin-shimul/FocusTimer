<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by Focus Timer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f9fafb 0%, #eef2ff 100%);
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(17, 24, 39, 0.12);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #4b5563;
        font-size: 15px;
        line-height: 1.6;
      }

      .url {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #f9fafb;
        color: #1f2937;
        font-size: 13px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Blocked during Work Mode</div>
      <h1>This tab is paused for now.</h1>
      <p>
        Focus Timer is keeping you in work mode. Switch to Play Mode or wait for the session to
        end, then come back to this tab.
      </p>
      <div class="url" id="blocked-url">No tab URL available.</div>
    </main>

    <script>
      const blockedUrl = new URLSearchParams(window.location.search).get('url');
      const blockedUrlElement = document.getElementById('blocked-url');

      if (blockedUrl) {
        blockedUrlElement.textContent = blockedUrl;
      }
    </script>
  </body>
</html>
