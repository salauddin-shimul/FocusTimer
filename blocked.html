<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're in Work Mode</title>
    <style>
      :root {
        --color-bg: #0b1020;
        --color-bg-alt: #111827;
        --color-surface: #0f172a;
        --color-text: #e5e7eb;
        --color-muted: #94a3b8;
        --color-border: #1f2937;
        --color-work: #16a34a;
        --color-ink: #f8fafc;
        --shadow-soft: 0 18px 48px rgba(15, 23, 42, 0.45);
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg-alt) 100%);
        color: var(--color-text);
        font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", sans-serif;
      }

      main {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        background: var(--color-surface);
        box-shadow: var(--shadow-soft);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(22, 163, 74, 0.2);
        color: #bbf7d0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 16px 0 0;
        color: var(--color-muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--color-muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .tab-title {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.6);
        color: var(--color-ink);
        font-size: 13px;
        font-weight: 700;
        word-break: break-word;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--color-border);
        color: var(--color-muted);
        font-size: 13px;
      }

      .actions {
        margin-top: 20px;
      }

      .back-button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        min-height: 44px;
        padding: 0 16px;
        background: #1f2937;
        color: #f8fafc;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(17, 24, 39, 0.16);
      }

      .back-button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" id="mode-badge">Blocked during Work Mode</div>
      <p class="eyebrow">Focus Timer</p>
      <h1 id="mode-heading">You're in Work Mode.</h1>
      <p id="mode-message">
        This tab is in your Play group, so it stays paused while your work session is active.
      </p>
      <div class="tab-title" id="blocked-title">Loading tab title...</div>
      <div class="status" id="blocked-status">Checking the timer...</div>
      <div class="actions">
        <button type="button" class="back-button" id="go-back">Go back</button>
      </div>
    </main>

    <script src="blocked.js" defer></script>
  </body>
</html>
