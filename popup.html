<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup" aria-label="Focus Timer">
      <header class="popup__header">
        <p class="popup__eyebrow">Focus Timer</p>
        <h1 class="popup__title">Stay on task, then take a break.</h1>
      </header>

      <section class="timer-panel" aria-labelledby="timer-heading">
        <h2 id="timer-heading" class="sr-only">Timer</h2>
        <div class="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="timer-editor" aria-label="Timer duration">
          <label class="timer-editor__label" id="timer-editor-label" for="timer-minutes">
            Session length (minutes)
          </label>
          <div class="timer-editor__controls">
            <input
              id="timer-minutes"
              class="timer-input"
              type="number"
              min="1"
              max="180"
              step="1"
              inputmode="numeric"
              value="25"
            />
            <button type="button" class="timer-set-button">Set</button>
          </div>
        </div>
        <button type="button" class="mode-indicator mode-indicator--work" aria-live="polite">
          Work Mode
        </button>
        <div class="timer-actions" role="group" aria-label="Timer controls">
          <button type="button" class="timer-action timer-action--start">Start Work</button>
          <button type="button" class="timer-action timer-action--pause">Pause Work</button>
          <button type="button" class="timer-action timer-action--stop">Stop Work</button>
        </div>
      </section>

      <section class="tabs-panel" aria-label="Tab lists">
        <article class="tab-group tab-group--work" aria-labelledby="work-tabs-heading">
          <header class="tab-group__header">
            <h2 id="work-tabs-heading">Work Tabs</h2>
          </header>
          <ul class="tab-list" aria-label="Work tabs"></ul>
          <div class="tab-picker" aria-label="Add a work tab">
            <label class="tab-picker__label" for="work-tab-select">Add tab to Work</label>
            <div class="tab-picker__controls">
              <select id="work-tab-select" class="tab-select" data-mode="work"></select>
              <button type="button" class="add-tab-button" data-mode="work">Add</button>
            </div>
          </div>
        </article>

        <article class="tab-group tab-group--play" aria-labelledby="play-tabs-heading">
          <header class="tab-group__header">
            <h2 id="play-tabs-heading">Play Tabs</h2>
          </header>
          <ul class="tab-list" aria-label="Play tabs"></ul>
          <div class="tab-picker" aria-label="Add a play tab">
            <label class="tab-picker__label" for="play-tab-select">Add tab to Play</label>
            <div class="tab-picker__controls">
              <select id="play-tab-select" class="tab-select" data-mode="play"></select>
              <button type="button" class="add-tab-button" data-mode="play">Add</button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
